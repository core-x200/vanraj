/* 🍎 iPhone Style Glass Card */

.box{
    display:none;

.box::before{

    content:"";

    position:absolute;

    top:-60%;
    left:-45%;

    width:60%;
    height:220%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.65),
        transparent
    );

    transform:rotate(20deg);

    animation:glassMove 6s linear infinite;
}

@keyframes glassMove{

    from{
        left:-60%;
    }

    to{
        left:150%;
    }

}

.introHeart{
    font-size:100px;

}

    to{

    }

0%,100%{

50%{

background:white;

/* ✨ AESTHETIC BACKGROUND */
body{
    overflow-x:hidden;
    overflow-y:auto;
    background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.7), transparent 20%),
    radial-gradient(circle at 80% 30%, rgba(255,182,193,.6), transparent 25%),

    animation:aestheticBG 10s ease infinite;
}

@keyframes aestheticBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}

/* ✨ MAIN BOX GLOW */
.box{
    animation:boxGlow 3s ease-in-out infinite;
}

@keyframes boxGlow{
    0%,100%{
        box-shadow:0 0 20px rgba(255,105,180,.3);
    }
    50%{
        box-shadow:
        0 0 25px rgba(255,20,147,.5),

    }
}

/* 🌟 FLOATING STAR */
.star{
    position:fixed;
    color:white;
    font-size:14px;
    pointer-events:none;
    z-index:1;
    animation:starFloat 5s linear forwards;
    text-shadow:0 0 10px white,0 0 20px #ff69b4;
}

@keyframes starFloat{
    0%{
        transform:translateY(0) scale(.5) rotate(0deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-100vh) scale(1.5) rotate(360deg);
        opacity:0;
    }
}

/* 💖 TOUCH HEART */
.touchHeart{
    position:fixed;
    pointer-events:none;
    z-index:999999;
    font-size:25px;
    animation:touchHeartAnim 1s ease-out forwards;
}

@keyframes touchHeartAnim{
    0%{
        transform:translate(-50%,-50%) scale(.5);
        opacity:1;
    }

    100%{
        transform:
        translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
        )
        scale(1.5)
        rotate(20deg);
        opacity:0;
    }
}

/* ✨ SPARKLE */
.sparkle{
    position:fixed;
    pointer-events:none;
    z-index:999998;
    color:white;
    font-size:18px;
    animation:sparkleAnim 1s ease-out forwards;
    text-shadow:0 0 10px #fff,0 0 20px #ff1493;
}

@keyframes sparkleAnim{
    0%{
        transform:scale(0) rotate(0deg);
        opacity:1;
    }

    50%{
        transform:scale(1.5) rotate(180deg);
        opacity:1;
    }

    100%{
        transform:scale(0) rotate(360deg);
        opacity:0;
    }
}

@keyframes petalFall{

    50%{

    }

.love-section{

.envelope{

/* 💌 AESTHETIC SECRET LETTERS ROOM */

.secret-room{
    position:relative;
    min-height:420px;
    padding:20px 10px;

}

@keyframes roomStar{
    0%,100%{

    }
    50%{
        opacity:1;
        transform:scale(1.3);
        text-shadow:0 0 15px white;
    }
}

/* 💌 Letter Area */

.aesthetic-letters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin:30px 5px;
}

/* 💌 Hanging Letter */

.aesthetic-letter{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    animation:letterSwing 4s infinite ease-in-out;
    transform-origin:top center;
}

.aesthetic-letter:nth-child(2){
    animation-delay:.5s;
}

.aesthetic-letter:nth-child(3){
    animation-delay:1s;
}

.aesthetic-letter:nth-child(4){
    animation-delay:1.5s;
}

.aesthetic-letter:nth-child(5){
    animation-delay:2s;
}

    0%,100%{
        transform:rotate(-4deg);
    }
    50%{
        transform:rotate(4deg);
    }
}
